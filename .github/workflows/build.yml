name: build

permissions:
  contents: write

on:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build_tests:
    name: build
    runs-on: ${{ matrix.os }}

    env:
        openblas_sdk: 0.3.33
        workspace: workspace

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: win64

    steps:
      - name: Checkout codes
        uses: "actions/checkout@v4"

      - name: Setup
        run: |
          Invoke-WebRequest -Uri https://github.com/OpenMathLib/OpenBLAS/releases/download/v${{ env.openblas_sdk }}/OpenBLAS-${{ env.openblas_sdk }}-x64.zip -OutFile ${{ env.workspace }}OpenBLAS.zip
          Expand-Archive -Path ${{ env.workspace }}OpenBLAS.zip -DestinationPath ${{ env.workspace }}

      - name: Build
        run: |
          cmake -S . -B build  -DOPENBLAS_DIR="${{ env.workspace }}"
          cmake --build build --config Release

      - name: Test
        run: |
          cd build
          ctest -C Release

      - name: Packaging
        run: |
          cd build
          cpack -C Release

      - name: Archive production artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact_name }}
          path: packages/*

  release:
    needs: [ build_tests ]
    name: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: packages
        pattern: package-*
        merge-multiple: true

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          packages/*
